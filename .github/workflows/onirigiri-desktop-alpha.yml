name: Onirigiri Desktop Alpha

# Builds unsigned installers of the desktop app with the Onirigiri workspace:
# an Apple silicon disk image, a Linux x64 AppImage and a Windows x64
# installer. Run it by hand, or push a tag named onirigiri-alpha-*. The
# installers are attached to the run. A tag also collects them in a draft
# prerelease, which is public only once someone publishes it.

on:
  workflow_dispatch:
  push:
    tags: ["onirigiri-alpha-*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            script: dist:desktop:dmg:arm64
            artifact: onirigiri-t3code-macos-arm64
            files: release/*.dmg
          - label: Linux x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            script: dist:desktop:linux
            artifact: onirigiri-t3code-linux-x64
            files: release/*.AppImage
          - label: Windows x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            script: dist:desktop:win:x64
            artifact: onirigiri-t3code-windows-x64
            files: release/*.exe
    steps:
      # checkout's credential cleanup runs submodule foreach even with
      # submodules disabled, which fails on the orphaned gitlinks in the
      # vendored .repos tree.
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/spatial... --filter=@t3tools/scripts...

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      # The alpha ships no update feed. This value is not an owner/name pair, so
      # the build bakes none in and the app reports updates as unavailable,
      # instead of asking this repository's releases for update files that
      # these unsigned builds do not publish.
      - name: Build installer
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: none
        run: vp run ${{ matrix.script }}

      - name: Name the installer after the fork
        shell: bash
        run: |
          set -euo pipefail
          prefix="Onirigiri-"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            prefix="Onirigiri-${GITHUB_REF_NAME#onirigiri-}-"
          fi
          for file in ${{ matrix.files }}; do
            mv "$file" "$(dirname "$file")/${prefix}$(basename "$file")"
          done

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: installers
          merge-multiple: true

      - name: Draft or update the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* \
              --draft \
              --prerelease \
              --verify-tag \
              --title "Onirigiri for T3 Code (Alpha): ${GITHUB_REF_NAME#onirigiri-}" \
              --notes "Unsigned alpha installers for macOS (Apple silicon), Windows (x64) and Linux (x64). The [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md) has the first-launch steps and the known limits. These builds do not update themselves."
          fi
